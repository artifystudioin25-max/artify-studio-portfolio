name: Rename portfolio file to index.html
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename portfolio file
        run: |
          if [ -f artify-studio-portfolio-2.html ]; then
            git config user.name "artifystudioin25-max"
            git config user.email "artifystudioin25-max@users.noreply.github.com"
            git mv artify-studio-portfolio-2.html index.html
            git commit -m "Rename portfolio file to index.html"
            git push
          else
            echo "File already renamed; nothing to do."
          fi
